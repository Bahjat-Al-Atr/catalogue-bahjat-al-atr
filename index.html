<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahjat Al Atr - Catalogue Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-dark: #0A0A0A;
            --secondary-dark: #1A1A1A;
            --accent-gold: #D4AF37;
            --light-gold: #F4E4A8;
            --dark-gold: #B8941F;
            --text-light: #F5F5F5;
            --text-gray: #888888;
            --shadow-glow: 0 0 30px rgba(212, 175, 55, 0.3);
            --shadow-heavy: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background: var(--primary-dark);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .luxury-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
                linear-gradient(135deg, var(--primary-dark) 0%, var(--secondary-dark) 100%);
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Header Style */
        .luxury-header {
            text-align: center;
            padding: 60px 0;
            margin-bottom: 50px;
            position: relative;
        }

        .brand-title {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 8px;
            color: var(--text-light);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 1.1rem;
            color: var(--text-gray);
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }

        .gold-bar {
            width: 100px;
            height: 2px;
            background: var(--accent-gold);
            margin: 0 auto 30px auto;
        }

        .access-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        /* Boutons modernes */
        .modern-btn {
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--text-gray);
            padding: 15px 35px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .modern-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
            transition: left 0.6s;
        }

        .modern-btn:hover::before {
            left: 100%;
        }

        .modern-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .modern-btn-primary {
            background: var(--accent-gold);
            color: var(--primary-dark);
            border-color: var(--accent-gold);
        }

        .modern-btn-primary:hover {
            background: transparent;
            color: var(--accent-gold);
        }

        /* Panneaux */
        .access-panel {
            display: none;
            background: var(--secondary-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 50px;
        }

        .access-panel.active {
            display: block;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel-title {
            color: var(--text-light);
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 40px 40px 20px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Grille de parfums */
        .perfume-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 30px;
            padding: 40px;
        }

        .perfume-card {
            background: var(--primary-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .perfume-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--accent-gold);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .perfume-card:hover {
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateY(-5px);
        }

        .perfume-card:hover::before {
            transform: scaleX(1);
        }

        .perfume-image {
            height: 200px;
            background: var(--secondary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            font-size: 3rem;
            position: relative;
        }

        .perfume-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(212, 175, 55, 0.05) 50%, transparent 70%);
        }

        .perfume-info {
            padding: 30px;
        }

        .perfume-name {
            font-size: 1.3rem;
            color: var(--text-light);
            margin-bottom: 10px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* Style du prix */
        .perfume-price {
            font-size: 1.5rem;
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price-currency {
            font-size: 1rem;
            color: var(--light-gold);
            font-weight: 400;
        }

        .perfume-details {
            color: var(--text-gray);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .perfume-detail {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .perfume-notes {
            margin-top: 20px;
        }

        .notes-title {
            color: var(--accent-gold);
            margin-bottom: 12px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .notes-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .note-tag {
            background: rgba(212, 175, 55, 0.1);
            color: var(--light-gold);
            padding: 4px 10px;
            border-radius: 1px;
            font-size: 0.8rem;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        /* Modal détaillé */
        .perfume-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .perfume-modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--secondary-dark);
            border: 1px solid rgba(212, 175, 55, 0.3);
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 500px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 10;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: var(--accent-gold);
        }

        .modal-image {
            background: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            font-size: 4rem;
        }

        .modal-info {
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .modal-name {
            font-size: 2rem;
            color: var(--text-light);
            margin-bottom: 20px;
            font-weight: 400;
        }

        .modal-price {
            font-size: 2rem;
            color: var(--accent-gold);
            margin-bottom: 30px;
            font-weight: 600;
        }

        .modal-details {
            margin-bottom: 30px;
        }

        .modal-detail {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            color: var(--text-gray);
        }

        .modal-notes {
            margin-top: 20px;
        }

        /* Formulaire admin */
        .admin-form {
            padding: 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-light);
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: var(--primary-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .price-input-container {
            position: relative;
        }

        .price-currency-symbol {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-gold);
            font-weight: 600;
        }

        .price-input {
            padding-left: 30px !important;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        /* Actions admin sur les cartes */
        .admin-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .action-btn.edit:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        .action-btn.delete:hover {
            background: rgba(231, 76, 60, 0.1);
            border-color: #e74c3c;
            color: #e74c3c;
        }

        /* Footer */
        .luxury-footer {
            text-align: center;
            padding: 60px 0;
            margin-top: 80px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-gray);
        }

        .footer-quote {
            font-style: italic;
            margin-top: 15px;
            font-size: 1.1rem;
            color: var(--text-light);
            font-weight: 300;
            margin-bottom: 25px;
        }

        .linktree-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
            padding: 10px 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .linktree-link:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--accent-gold);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .brand-title {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
            
            .access-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .perfume-grid {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            
            .modern-btn {
                width: 100%;
                justify-content: center;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .admin-actions {
                flex-direction: column;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }

            .modal-content {
                grid-template-columns: 1fr;
                max-height: 90vh;
                overflow-y: auto;
            }

            .modal-image {
                height: 200px;
            }

            .modal-info {
                padding: 30px;
            }
        }

        /* État vide */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-gray);
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--accent-gold);
        }
    </style>
</head>
<body>
    <div class="luxury-bg"></div>
    
    <div class="container">
        <!-- En-tête principal -->
        <div class="luxury-header">
            <h1 class="brand-title">BAHJAT AL ATR</h1>
            <div class="gold-bar"></div>
            <p class="brand-subtitle">MAISON DE PARFUM D'EXCEPTION</p>
            
            <div class="access-buttons">
                <button class="modern-btn modern-btn-primary" onclick="showClientAccess()">
                    DÉCOUVRIR LA COLLECTION
                </button>
                <button class="modern-btn" onclick="showAdminAccess()">
                    ESPACE ADMIN
                </button>
            </div>
        </div>

        <!-- Panneau Client -->
        <div class="access-panel active" id="clientPanel">
            <h2 class="panel-title">Collection Signature</h2>
            <div class="perfume-grid" id="clientPerfumeGrid">
                <!-- Parfums chargés dynamiquement -->
            </div>
        </div>

        <!-- Panneau Admin -->
        <div class="access-panel" id="adminPanel">
            <h2 class="panel-title">Gestion de la Collection</h2>
            
            <div class="admin-form">
                <form id="perfumeForm">
                    <input type="hidden" id="perfumeId">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Nom du Parfum</label>
                            <input type="text" class="form-input" id="perfumeName" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Marque</label>
                            <input type="text" class="form-input" id="perfumeBrand" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Volume</label>
                            <input type="text" class="form-input" id="perfumeSize" placeholder="100ml" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Genre</label>
                            <select class="form-input" id="perfumeGender" required>
                                <option value="">Sélectionner</option>
                                <option value="Féminin">Féminin</option>
                                <option value="Masculin">Masculin</option>
                                <option value="Unisexe">Unisexe</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Prix</label>
                            <div class="price-input-container">
                                <span class="price-currency-symbol">€</span>
                                <input type="number" class="form-input price-input" id="perfumePrice" placeholder="0.00" min="0" step="0.01" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Notes Olfactives</label>
                            <input type="text" class="form-input" id="perfumeNotes" placeholder="Vanille, Ambre, Patchouli..." required>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="modern-btn modern-btn-primary" id="savePerfume">
                            ENREGISTRER
                        </button>
                        <button type="button" class="modern-btn" id="cancelEdit" onclick="resetForm()">
                            ANNULER
                        </button>
                    </div>
                </form>
            </div>

            <div class="perfume-grid" id="adminPerfumeGrid">
                <!-- Parfums avec options admin -->
            </div>
        </div>

        <!-- Modal détaillé -->
        <div class="perfume-modal" id="perfumeModal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
                <div class="modal-image" id="modalImage">
                    <i class="fas fa-gem"></i>
                </div>
                <div class="modal-info" id="modalInfo">
                    <!-- Contenu chargé dynamiquement -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="luxury-footer">
            <p class="footer-quote">"Quand l'élégance du parfum prend tout son sens"</p>
            <a href="https://linktr.ee/bahjatalatr?utm_source=linktree_profile_share&ltsid=d14ad074-6f51-4fd6-b9d8-c24a648e7166" 
               class="linktree-link" target="_blank">
                <i class="fas fa-link"></i>
                Retrouvez-nous sur Linktree
            </a>
            <p style="margin-top: 25px;">© 2025 BAHJAT AL ATR – TOUS DROITS RÉSERVÉS</p>
        </div>
    </div>

    <script>
        // Données initiales avec prix
        const initialPerfumes = [
            {
                id: 1,
                name: "Khamrah Dukhan",
                brand: "Lattafa",
                size: "100ml",
                gender: "Unisexe",
                price: 89.90,
                notes: ["Piment", "Mandarine", "Incense", "Ciste", "Patchouli", "Fleurs d'oranger", "Tabac", "Praline", "Ambre", "Fèves de tonkas", "Bensoide"]
            },
            {
                id: 2,
                name: "Venezia Pistachio",
                brand: "Gulf Fragance Dubai",
                size: "80ml",
                gender: "Unisexe",
                price: 79.90,
                notes: ["Pistaches", "Amandes", "Crème fouettée", "Héliotrope", "Musc", "Bois de santal"]
            },
            {
                id: 3,
                name: "Yara Rose",
                brand: "Lattafa",
                size: "100ml / 35ml",
                gender: "Féminin",
                price: 69.90,
                notes: ["Mandarine", "Poire", "Orchidée", "Vanille", "Bois de santale", "Musc", "Héliotrope", "Bergamote"]
            },
            {
                id: 4,
                name: "Yara Blanc",
                brand: "Lattafa",
                size: "100ml",
                gender: "Féminin",
                price: 65.90,
                notes: ["Jasmin", "Pêche", "Ambre", "Caramel", "Bois de santal", "Patchouli"]
            },
            {
                id: 5,
                name: "Yara Black",
                brand: "Lattafa",
                size: "100ml",
                gender: "Masculin",
                price: 74.90,
                notes: ["Ananas", "Tabac", "Poivre noir", "Vanille", "Café", "Patchouli", "Ambre", "Benjoin", "Bois", "Labdanum"]
            },
            {
                id: 6,
                name: "Ameerat al Arab Rouge",
                brand: "Lattafa",
                size: "50ml",
                gender: "Féminin",
                price: 59.90,
                notes: ["Pamplemousse", "Orange", "Jasmin", "Muse Blanc", "Ambre", "Bois de santal", "Vanille", "Fèves de Tonka"]
            }
        ];

        // Variables globales
        let perfumes = [];
        let editingId = null;

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            loadPerfumes();
            setupEventListeners();
        });

        // Configuration des écouteurs d'événements
        function setupEventListeners() {
            document.getElementById('perfumeForm').addEventListener('submit', handleFormSubmit);
        }

        // Charger les parfums
        function loadPerfumes() {
            const storedPerfumes = localStorage.getItem('bahjatAlAtrPerfumes');
            if (storedPerfumes) {
                perfumes = JSON.parse(storedPerfumes);
            } else {
                perfumes = [...initialPerfumes];
                savePerfumes();
            }
            renderClientPerfumes();
            renderAdminPerfumes();
        }

        // Sauvegarder les parfums
        function savePerfumes() {
            localStorage.setItem('bahjatAlAtrPerfumes', JSON.stringify(perfumes));
        }

        // Afficher l'accès client
        function showClientAccess() {
            document.getElementById('clientPanel').classList.add('active');
            document.getElementById('adminPanel').classList.remove('active');
            renderClientPerfumes();
        }

        // Afficher l'accès admin
        function showAdminAccess() {
            const password = prompt('Mot de passe administrateur :');
            if (password === "doHBDposcqksjnPibizabcqksjncsqiuPBDAP0827190I2`*¨M*%+*+¨1I820JANDPQ") {
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('clientPanel').classList.remove('active');
                renderAdminPerfumes();
            } else {
                alert('Accès refusé');
            }
        }

        // Formatage du prix
        function formatPrice(price) {
            return new Intl.NumberFormat('fr-FR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(price);
        }

        // Ouvrir le modal détaillé
        function openPerfumeModal(perfumeId) {
            const perfume = perfumes.find(p => p.id === perfumeId);
            if (perfume) {
                document.getElementById('modalInfo').innerHTML = `
                    <h2 class="modal-name">${perfume.name}</h2>
                    <div class="modal-price">${formatPrice(perfume.price)} €</div>
                    <div class="modal-details">
                        <div class="modal-detail">
                            <i class="fas fa-tag"></i>
                            <span><strong>Marque:</strong> ${perfume.brand}</span>
                        </div>
                        <div class="modal-detail">
                            <i class="fas fa-flask"></i>
                            <span><strong>Volume:</strong> ${perfume.size}</span>
                        </div>
                        <div class="modal-detail">
                            <i class="fas fa-${getGenderIcon(perfume.gender)}"></i>
                            <span><strong>Genre:</strong> ${perfume.gender}</span>
                        </div>
                    </div>
                    <div class="modal-notes">
                        <div class="notes-title">Composition Olfactive</div>
                        <div class="notes-grid">
                            ${perfume.notes.map(note => `<span class="note-tag">${note}</span>`).join('')}
                        </div>
                    </div>
                `;
                document.getElementById('perfumeModal').classList.add('active');
            }
        }

        // Fermer le modal
        function closeModal() {
            document.getElementById('perfumeModal').classList.remove('active');
        }

        // Rendu pour les clients
        function renderClientPerfumes() {
            const grid = document.getElementById('clientPerfumeGrid');
            
            if (perfumes.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-wind"></i>
                        <h3>Collection en Préparation</h3>
                        <p>Notre collection de parfums exclusifs arrive bientôt...</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = perfumes.map(perfume => `
                <div class="perfume-card" onclick="openPerfumeModal(${perfume.id})">
                    <div class="perfume-image">
                        <i class="fas fa-gem"></i>
                    </div>
                    <div class="perfume-info">
                        <h3 class="perfume-name">${perfume.name}</h3>
                        <div class="perfume-price">
                            ${formatPrice(perfume.price)}
                            <span class="price-currency">EUR</span>
                        </div>
                        <div class="perfume-details">
                            <div class="perfume-detail">
                                <i class="fas fa-tag"></i>
                                <span>${perfume.brand}</span>
                            </div>
                            <div class="perfume-detail">
                                <i class="fas fa-flask"></i>
                                <span>${perfume.size}</span>
                            </div>
                            <div class="perfume-detail">
                                <i class="fas fa-${getGenderIcon(perfume.gender)}"></i>
                                <span>${perfume.gender}</span>
                            </div>
                        </div>
                        <div class="perfume-notes">
                            <div class="notes-title">Composition</div>
                            <div class="notes-grid">
                                ${perfume.notes.slice(0, 4).map(note => `<span class="note-tag">${note}</span>`).join('')}
                                ${perfume.notes.length > 4 ? `<span class="note-tag">+${perfume.notes.length - 4} autres</span>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Rendu pour l'admin
        function renderAdminPerfumes() {
            const grid = document.getElementById('adminPerfumeGrid');
            
            if (perfumes.length === 0) {
                grid.innerHTML = '<div class="empty-state"><i class="fas fa-wind"></i><h3>Aucun parfum dans la collection</h3></div>';
                return;
            }
            
            grid.innerHTML = perfumes.map(perfume => `
                <div class="perfume-card">
                    <div class="perfume-image">
                        <i class="fas fa-gem"></i>
                    </div>
                    <div class="perfume-info">
                        <h3 class="perfume-name">${perfume.name}</h3>
                        <div class="perfume-price">
                            ${formatPrice(perfume.price)}
                            <span class="price-currency">EUR</span>
                        </div>
                        <div class="perfume-details">
                            <div class="perfume-detail">
                                <i class="fas fa-tag"></i>
                                <span>${perfume.brand}</span>
                            </div>
                            <div class="perfume-detail">
                                <i class="fas fa-flask"></i>
                                <span>${perfume.size}</span>
                            </div>
                            <div class="perfume-detail">
                                <i class="fas fa-${getGenderIcon(perfume.gender)}"></i>
                                <span>${perfume.gender}</span>
                            </div>
                        </div>
                        <div class="perfume-notes">
                            <div class="notes-title">Notes</div>
                            <div class="notes-grid">
                                ${perfume.notes.map(note => `<span class="note-tag">${note}</span>`).join('')}
                            </div>
                        </div>
                        <div class="admin-actions">
                            <button class="action-btn edit" onclick="editPerfume(${perfume.id})">
                                <i class="fas fa-edit"></i> Modifier
                            </button>
                            <button class="action-btn delete" onclick="deletePerfume(${perfume.id})">
                                <i class="fas fa-trash"></i> Supprimer
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Gestion du formulaire admin
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const perfumeData = {
                name: document.getElementById('perfumeName').value.trim(),
                brand: document.getElementById('perfumeBrand').value.trim(),
                size: document.getElementById('perfumeSize').value.trim(),
                gender: document.getElementById('perfumeGender').value,
                price: parseFloat(document.getElementById('perfumePrice').value),
                notes: document.getElementById('perfumeNotes').value.split(',').map(note => note.trim()).filter(note => note !== '')
            };
            
            if (editingId) {
                updatePerfume(editingId, perfumeData);
            } else {
                addPerfume(perfumeData);
            }
            
            resetForm();
            renderClientPerfumes();
            renderAdminPerfumes();
        }

        function addPerfume(perfumeData) {
            const newPerfume = {
                id: Date.now(),
                ...perfumeData
            };
            perfumes.push(newPerfume);
            savePerfumes();
            alert('Parfum ajouté avec succès !');
        }

        function updatePerfume(id, perfumeData) {
            const index = perfumes.findIndex(p => p.id === id);
            if (index !== -1) {
                perfumes[index] = { id, ...perfumeData };
                savePerfumes();
                alert('Parfum modifié avec succès !');
            }
        }

        function deletePerfume(id) {
            if (confirm('Êtes-vous sûr de vouloir supprimer ce parfum ?')) {
                perfumes = perfumes.filter(p => p.id !== id);
                savePerfumes();
                renderClientPerfumes();
                renderAdminPerfumes();
                if (editingId === id) resetForm();
            }
        }

        function editPerfume(id) {
            const perfume = perfumes.find(p => p.id === id);
            if (perfume) {
                document.getElementById('perfumeId').value = perfume.id;
                document.getElementById('perfumeName').value = perfume.name;
                document.getElementById('perfumeBrand').value = perfume.brand;
                document.getElementById('perfumeSize').value = perfume.size;
                document.getElementById('perfumeGender').value = perfume.gender;
                document.getElementById('perfumePrice').value = perfume.price;
                document.getElementById('perfumeNotes').value = perfume.notes.join(', ');
                editingId = id;
                
                // Scroll vers le formulaire
                document.getElementById('perfumeForm').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function resetForm() {
            document.getElementById('perfumeForm').reset();
            document.getElementById('perfumeId').value = '';
            editingId = null;
        }

        function getGenderIcon(gender) {
            switch(gender) {
                case 'Féminin': return 'venus';
                case 'Masculin': return 'mars';
                default: return 'neuter';
            }
        }

        // Rendre les fonctions accessibles globalement
        window.showClientAccess = showClientAccess;
        window.showAdminAccess = showAdminAccess;
        window.editPerfume = editPerfume;
        window.deletePerfume = deletePerfume;
        window.openPerfumeModal = openPerfumeModal;
        window.closeModal = closeModal;
        window.resetForm = resetForm;
    </script>
</body>
</html>
