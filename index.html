<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahjat Al Atr - Catalogue de Luxe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-gold: #b8941f;
            --dark-brown: #2c1a0a;
            --black: #000000;
            --light-gold: #f4e4a8;
            --cream: #f8f4e9;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Playfair Display', 'Times New Roman', serif;
        }

        body {
            background: linear-gradient(135deg, var(--dark-brown) 0%, var(--black) 100%);
            color: var(--cream);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .luxury-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(44, 26, 10, 0.8) 0%, transparent 50%);
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Header Luxueux */
        .luxury-header {
            text-align: center;
            padding: 50px 0;
            background: linear-gradient(135deg, rgba(44, 26, 10, 0.9), rgba(0, 0, 0, 0.9));
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--primary-gold);
            position: relative;
            overflow: hidden;
        }

        .luxury-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-gold), transparent);
        }

        .brand-title {
            font-size: 3.5rem;
            color: var(--primary-gold);
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            letter-spacing: 3px;
        }

        .brand-subtitle {
            font-size: 1.3rem;
            color: var(--light-gold);
            font-style: italic;
            margin-bottom: 25px;
        }

        .access-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        /* Boutons de luxe */
        .luxury-btn {
            background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
            color: var(--dark-brown);
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .luxury-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .luxury-btn:hover::before {
            left: 100%;
        }

        .luxury-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--glow);
        }

        .luxury-btn-secondary {
            background: transparent;
            color: var(--primary-gold);
            border: 2px solid var(--primary-gold);
        }

        .luxury-btn-secondary:hover {
            background: var(--primary-gold);
            color: var(--dark-brown);
        }

        /* Panneaux d'accès */
        .access-panel {
            display: none;
            background: linear-gradient(135deg, rgba(44, 26, 10, 0.95), rgba(0, 0, 0, 0.95));
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--primary-gold);
            backdrop-filter: blur(10px);
        }

        .access-panel.active {
            display: block;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel-title {
            color: var(--primary-gold);
            margin-bottom: 30px;
            text-align: center;
            font-size: 2rem;
            border-bottom: 2px solid var(--primary-gold);
            padding-bottom: 15px;
        }

        /* Grille de parfums */
        .perfume-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .perfume-card {
            background: linear-gradient(135deg, rgba(44, 26, 10, 0.9), rgba(0, 0, 0, 0.9));
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.4s ease;
            border: 1px solid transparent;
            position: relative;
        }

        .perfume-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .perfume-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: var(--glow);
            border-color: var(--primary-gold);
        }

        .perfume-card:hover::before {
            opacity: 1;
        }

        .perfume-image {
            height: 250px;
            background: linear-gradient(135deg, var(--dark-brown), var(--black));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-gold);
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }

        .perfume-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(212, 175, 55, 0.1) 50%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .perfume-info {
            padding: 30px;
        }

        .perfume-name {
            font-size: 1.6rem;
            color: var(--primary-gold);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .perfume-details {
            color: var(--light-gold);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .perfume-detail {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .perfume-notes {
            margin-top: 20px;
        }

        .notes-title {
            color: var(--primary-gold);
            margin-bottom: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notes-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .note-tag {
            background: rgba(212, 175, 55, 0.2);
            color: var(--light-gold);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
        }

        .note-tag:hover {
            background: rgba(212, 175, 55, 0.3);
            transform: scale(1.05);
        }

        /* Formulaire admin */
        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            color: var(--primary-gold);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            color: var(--cream);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        /* Footer */
        .luxury-footer {
            text-align: center;
            padding: 50px 0;
            margin-top: 80px;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--light-gold);
        }

        .footer-quote {
            font-style: italic;
            margin-top: 15px;
            font-size: 1.1rem;
            color: var(--primary-gold);
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .brand-title {
                font-size: 2.5rem;
            }
            
            .access-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .perfume-grid {
                grid-template-columns: 1fr;
            }
            
            .luxury-btn {
                width: 100%;
                justify-content: center;
            }
            
            .form-actions {
                flex-direction: column;
            }
        }

        /* État vide */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--light-gold);
        }

        .empty-state i {
            font-size: 5rem;
            margin-bottom: 25px;
            color: var(--primary-gold);
        }
    </style>
</head>
<body>
    <div class="luxury-bg"></div>
    
    <div class="container">
        <!-- En-tête principal -->
        <div class="luxury-header fade-in">
            <h1 class="brand-title">BAHJAT AL ATR</h1>
            <p class="brand-subtitle">L'Art Olfactif Réinventé</p>
            
            <div class="access-buttons">
                <button class="luxury-btn" onclick="showClientAccess()">
                    <i class="fas fa-eye"></i>
                    Accès Client
                </button>
                <button class="luxury-btn luxury-btn-secondary" onclick="showAdminAccess()">
                    <i class="fas fa-lock"></i>
                    Accès Administrateur
                </button>
            </div>
        </div>

        <!-- Panneau Client -->
        <div class="access-panel" id="clientPanel">
            <h2 class="panel-title">Notre Collection Exclusive</h2>
            <div class="perfume-grid" id="clientPerfumeGrid">
                <!-- Parfums chargés dynamiquement -->
            </div>
        </div>

        <!-- Panneau Admin -->
        <div class="access-panel" id="adminPanel">
            <h2 class="panel-title">Panneau d'Administration</h2>
            
            <form id="perfumeForm">
                <input type="hidden" id="perfumeId">
                
                <div class="form-group">
                    <label class="form-label">Nom du parfum</label>
                    <input type="text" class="form-input" id="perfumeName" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Marque</label>
                    <input type="text" class="form-input" id="perfumeBrand" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Volume</label>
                    <input type="text" class="form-input" id="perfumeSize" placeholder="ex: 100ml" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Genre</label>
                    <select class="form-input" id="perfumeGender" required>
                        <option value="">Sélectionner</option>
                        <option value="Féminin">Féminin</option>
                        <option value="Masculin">Masculin</option>
                        <option value="Unisexe">Unisexe</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Notes olfactives</label>
                    <textarea class="form-input" id="perfumeNotes" placeholder="Saisissez les notes séparées par des virgules" required></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="luxury-btn" id="savePerfume">
                        <i class="fas fa-save"></i>
                        Enregistrer
                    </button>
                    <button type="button" class="luxury-btn luxury-btn-secondary" id="cancelEdit">
                        <i class="fas fa-times"></i>
                        Annuler
                    </button>
                </div>
            </form>

            <div class="perfume-grid" id="adminPerfumeGrid" style="margin-top: 50px;">
                <!-- Parfums avec options admin -->
            </div>
        </div>

        <!-- Footer -->
        <div class="luxury-footer">
            <p>© 2025 Bahjat Al Atr – Tous droits réservés</p>
            <p class="footer-quote">"L'élégance du parfum, née de la passion pour l'art olfactif"</p>
        </div>
    </div>

    <script>
        // Données initiales
        const initialPerfumes = [
            {
                id: 1,
                name: "Khamrah Dukhan",
                brand: "Lattafa",
                size: "100ml",
                gender: "Unisexe",
                notes: ["Piment", "Mandarine", "Incense", "Ciste", "Patchouli", "Fleurs d'oranger", "Tabac", "Praline", "Ambre", "Fèves de tonkas", "Bensoide"]
            },
            {
                id: 2,
                name: "Venezia Pistachio",
                brand: "Gulf Fragance Dubai",
                size: "80ml",
                gender: "Unisexe",
                notes: ["Pistaches", "Amandes", "Crème fouettée", "Héliotrope", "Musc", "Bois de santal"]
            },
            {
                id: 3,
                name: "Yara Rose",
                brand: "Lattafa",
                size: "100ml / 35ml",
                gender: "Féminin",
                notes: ["Mandarine", "Poire", "Orchidée", "Vanille", "Bois de santale", "Musc", "Héliotrope", "Bergamote"]
            },
            {
                id: 4,
                name: "Yara Blanc",
                brand: "Lattafa",
                size: "100ml",
                gender: "Féminin",
                notes: ["Jasmin", "Pêche", "Ambre", "Caramel", "Bois de santal", "Patchouli"]
            },
            {
                id: 5,
                name: "Yara Black",
                brand: "Lattafa",
                size: "100ml",
                gender: "Masculin",
                notes: ["Ananas", "Tabac", "Poivre noir", "Vanille", "Café", "Patchouli", "Ambre", "Benjoin", "Bois", "Labdanum"]
            },
            {
                id: 6,
                name: "Ameerat al Arab Rouge",
                brand: "Lattafa",
                size: "50ml",
                gender: "Féminin",
                notes: ["Pamplemousse", "Orange", "Jasmin", "Muse Blanc", "Ambre", "Bois de santal", "Vanille", "Fèves de Tonka"]
            }
        ];

        // Variables globales
        let perfumes = [];
        let editingId = null;
        let isAdminMode = false;

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            loadPerfumes();
            showClientAccess(); // Afficher directement l'accès client
        });

        // Charger les parfums
        function loadPerfumes() {
            const storedPerfumes = localStorage.getItem('bahjatAlAtrPerfumes');
            if (storedPerfumes) {
                perfumes = JSON.parse(storedPerfumes);
            } else {
                perfumes = [...initialPerfumes];
                savePerfumes();
            }
            renderClientPerfumes();
            renderAdminPerfumes();
        }

        // Sauvegarder les parfums
        function savePerfumes() {
            localStorage.setItem('bahjatAlAtrPerfumes', JSON.stringify(perfumes));
        }

        // Afficher l'accès client
        function showClientAccess() {
            document.getElementById('clientPanel').classList.add('active');
            document.getElementById('adminPanel').classList.remove('active');
            isAdminMode = false;
            renderClientPerfumes();
        }

        // Afficher l'accès admin
        function showAdminAccess() {
            const password = prompt('Mot de passe administrateur :');
            if (password === "doHBDposcqksjnPibizabcqksjncsqiuPBDAP0827190I2`*¨M*%+*+¨1I820JANDPQ") {
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('clientPanel').classList.remove('active');
                isAdminMode = true;
                renderAdminPerfumes();
            } else {
                alert('Accès refusé');
            }
        }

        // Rendu pour les clients
        function renderClientPerfumes() {
            const grid = document.getElementById('clientPerfumeGrid');
            
            if (perfumes.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-wind"></i>
                        <h3>Collection en Préparation</h3>
                        <p>Notre collection de parfums exclusifs arrive bientôt...</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = perfumes.map(perfume => `
                <div class="perfume-card">
                    <div class="perfume-image">
                        <i class="fas fa-gem"></i>
                    </div>
                    <div class="perfume-info">
                        <h3 class="perfume-name">${perfume.name}</h3>
                        <div class="perfume-details">
                            <div class="perfume-detail">
                                <i class="fas fa-tag"></i>
                                <span>${perfume.brand}</span>
                            </div>
                            <div class="perfume-detail">
                                <i class="fas fa-flask"></i>
                                <span>${perfume.size}</span>
                            </div>
                            <div class="perfume-detail">
                                <i class="fas fa-${getGenderIcon(perfume.gender)}"></i>
                                <span>${perfume.gender}</span>
                            </div>
                        </div>
                        <div class="perfume-notes">
                            <div class="notes-title">
                                <i class="fas fa-leaf"></i>
                                Composition Olfactive
                            </div>
                            <div class="notes-grid">
                                ${perfume.notes.map(note => `<span class="note-tag">${note}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Rendu pour l'admin
        function renderAdminPerfumes() {
            const grid = document.getElementById('adminPerfumeGrid');
            
            if (perfumes.length === 0) {
                grid.innerHTML = '<div class="empty-state"><i class="fas fa-wind"></i><h3>Aucun parfum</h3></div>';
                return;
            }
            
            grid.innerHTML = perfumes.map(perfume => `
                <div class="perfume-card">
                    <div class="perfume-image">
                        <i class="fas fa-gem"></i>
                    </div>
                    <div class="perfume-info">
                        <h3 class="perfume-name">${perfume.name}</h3>
                        <div class="perfume-details">
                            <div class="perfume-detail">
                                <i class="fas fa-tag"></i>
                                <span>${perfume.brand}</span>
                            </div>
                            <div class="perfume-detail">
                                <i class="fas fa-flask"></i>
                                <span>${perfume.size}</span>
                            </div>
                            <div class="perfume-detail">
                                <i class="fas fa-${getGenderIcon(perfume.gender)}"></i>
                                <span>${perfume.gender}</span>
                            </div>
                        </div>
                        <div class="perfume-notes">
                            <div class="notes-title">
                                <i class="fas fa-leaf"></i>
                                Notes
                            </div>
                            <div class="notes-grid">
                                ${perfume.notes.map(note => `<span class="note-tag">${note}</span>`).join('')}
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="luxury-btn luxury-btn-secondary" onclick="editPerfume(${perfume.id})">
                                <i class="fas fa-edit"></i>
                                Modifier
                            </button>
                            <button class="luxury-btn" style="background: #e74c3c;" onclick="deletePerfume(${perfume.id})">
                                <i class="fas fa-trash"></i>
                                Supprimer
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Gestion du formulaire admin
        document.getElementById('perfumeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const perfumeData = {
                name: document.getElementById('perfumeName').value.trim(),
                brand: document.getElementById('perfumeBrand').value.trim(),
                size: document.getElementById('perfumeSize').value.trim(),
                gender: document.getElementById('perfumeGender').value,
                notes: document.getElementById('perfumeNotes').value.split(',').map(note => note.trim()).filter(note => note !== '')
            };
            
            if (editingId) {
                updatePerfume(editingId, perfumeData);
            } else {
                addPerfume(perfumeData);
            }
            
            resetForm();
            renderClientPerfumes();
            renderAdminPerfumes();
        });

        document.getElementById('cancelEdit').addEventListener('click', resetForm);

        function addPerfume(perfumeData) {
            const newPerfume = {
                id: Date.now(),
                ...perfumeData
            };
            perfumes.push(newPerfume);
            savePerfumes();
            alert('Parfum ajouté avec succès !');
        }

        function updatePerfume(id, perfumeData) {
            const index = perfumes.findIndex(p => p.id === id);
            if (index !== -1) {
                perfumes[index] = { id, ...perfumeData };
                savePerfumes();
                alert('Parfum modifié avec succès !');
            }
        }

        function deletePerfume(id) {
            if (confirm('Supprimer ce parfum ?')) {
                perfumes = perfumes.filter(p => p.id !== id);
                savePerfumes();
                renderClientPerfumes();
                renderAdminPerfumes();
                if (editingId === id) resetForm();
            }
        }

        function editPerfume(id) {
            const perfume = perfumes.find(p => p.id === id);
            if (perfume) {
                document.getElementById('perfumeId').value = perfume.id;
                document.getElementById('perfumeName').value = perfume.name;
                document.getElementById('perfumeBrand').value = perfume.brand;
                document.getElementById('perfumeSize').value = perfume.size;
                document.getElementById('perfumeGender').value = perfume.gender;
                document.getElementById('perfumeNotes').value = perfume.notes.join(', ');
                editingId = id;
                document.getElementById('savePerfume').innerHTML = '<i class="fas fa-edit"></i> Modifier';
            }
        }

        function resetForm() {
            document.getElementById('perfumeForm').reset();
            document.getElementById('perfumeId').value = '';
            editingId = null;
            document.getElementById('savePerfume').innerHTML = '<i class="fas fa-save"></i> Enregistrer';
        }

        function getGenderIcon(gender) {
            switch(gender) {
                case 'Féminin': return 'venus';
                case 'Masculin': return 'mars';
                default: return 'neuter';
            }
        }
    </script>
</body>
</html>
