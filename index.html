<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahjat Al Atr - Catalogue Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-dark: #1A120B;
            --secondary-dark: #2C1A0A;
            --accent-gold: #D4AF37;
            --light-gold: #F4E4A8;
            --dark-gold: #B8941F;
            --warm-brown: #3A2618;
            --text-light: #F5F5F5;
            --text-gray: #A8A8A8;
            --shadow-glow: 0 0 30px rgba(212, 175, 55, 0.2);
            --shadow-heavy: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cormorant Garamond', 'Times New Roman', serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--warm-brown) 100%);
            color: var(--text-light);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .luxury-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(58, 38, 24, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, var(--primary-dark) 0%, var(--secondary-dark) 100%);
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Header Style */
        .luxury-header {
            text-align: center;
            padding: 80px 0 60px 0;
            margin-bottom: 50px;
            position: relative;
        }

        .brand-title {
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: 6px;
            color: var(--text-light);
            margin-bottom: 20px;
            text-transform: uppercase;
            font-family: 'Cormorant Garamond', serif;
        }

        .brand-subtitle {
            font-size: 1.3rem;
            color: var(--light-gold);
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 40px;
            font-style: italic;
        }

        .gold-bar {
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            margin: 0 auto 40px auto;
        }

        .access-buttons {
            display: flex;
            gap: 25px;
            justify-content: center;
            margin-top: 40px;
        }

        /* Boutons luxueux */
        .luxury-btn {
            background: linear-gradient(135deg, var(--accent-gold), var(--dark-gold));
            color: var(--primary-dark);
            border: none;
            padding: 18px 40px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-glow);
        }

        .luxury-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }

        .luxury-btn:hover::before {
            left: 100%;
        }

        .luxury-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        .luxury-btn-secondary {
            background: transparent;
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
            box-shadow: none;
        }

        .luxury-btn-secondary:hover {
            background: var(--accent-gold);
            color: var(--primary-dark);
        }

        /* Panneaux */
        .access-panel {
            display: none;
            background: rgba(42, 28, 16, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 60px;
            backdrop-filter: blur(10px);
        }

        .access-panel.active {
            display: block;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel-title {
            color: var(--light-gold);
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 50px 50px 30px 50px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
        }

        /* Grille de parfums */
        .perfume-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 35px;
            padding: 50px;
        }

        .perfume-card {
            background: linear-gradient(135deg, var(--secondary-dark), var(--warm-brown));
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--shadow-heavy);
        }

        .perfume-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .perfume-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
        }

        .perfume-card:hover::before {
            transform: scaleX(1);
        }

        .perfume-image {
            height: 220px;
            background: linear-gradient(135deg, var(--primary-dark), var(--secondary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            font-size: 3.5rem;
            position: relative;
            overflow: hidden;
        }

        .perfume-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(212, 175, 55, 0.1) 50%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .perfume-info {
            padding: 35px;
        }

        .perfume-name {
            font-size: 1.6rem;
            color: var(--text-light);
            margin-bottom: 15px;
            font-weight: 400;
            letter-spacing: 1px;
            font-family: 'Cormorant Garamond', serif;
        }

        /* Style du prix */
        .perfume-price {
            font-size: 1.8rem;
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cormorant Garamond', serif;
        }

        .price-currency {
            font-size: 1.1rem;
            color: var(--light-gold);
            font-weight: 400;
        }

        .perfume-details {
            color: var(--text-gray);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .perfume-detail {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
        }

        .perfume-notes {
            margin-top: 25px;
        }

        .notes-title {
            color: var(--accent-gold);
            margin-bottom: 15px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Cormorant Garamond', serif;
        }

        .notes-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .note-tag {
            background: rgba(212, 175, 55, 0.15);
            color: var(--light-gold);
            padding: 6px 14px;
            border-radius: 2px;
            font-size: 0.85rem;
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
        }

        .note-tag:hover {
            background: rgba(212, 175, 55, 0.25);
            transform: translateY(-2px);
        }

        /* Modal détaillé */
        .perfume-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 18, 11, 0.98);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .perfume-modal.active {
            display: flex;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(135deg, var(--secondary-dark), var(--warm-brown));
            border: 2px solid rgba(212, 175, 55, 0.4);
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 550px;
            position: relative;
            box-shadow: var(--shadow-heavy);
        }

        .modal-close {
            position: absolute;
            top: 25px;
            right: 25px;
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 10;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: var(--accent-gold);
        }

        .modal-image {
            background: linear-gradient(135deg, var(--primary-dark), var(--secondary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            font-size: 5rem;
        }

        .modal-info {
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .modal-name {
            font-size: 2.5rem;
            color: var(--text-light);
            margin-bottom: 25px;
            font-weight: 400;
            font-family: 'Cormorant Garamond', serif;
        }

        .modal-price {
            font-size: 2.5rem;
            color: var(--accent-gold);
            margin-bottom: 35px;
            font-weight: 600;
            font-family: 'Cormorant Garamond', serif;
        }

        .modal-details {
            margin-bottom: 35px;
        }

        .modal-detail {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
            color: var(--text-gray);
            font-size: 1.1rem;
        }

        .modal-notes {
            margin-top: 25px;
        }

        /* Formulaire admin */
        .admin-form {
            padding: 50px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            color: var(--light-gold);
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Cormorant Garamond', serif;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(26, 18, 11, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--text-light);
            font-size: 1.1rem;
            transition: all 0.3s ease;
            font-family: 'Cormorant Garamond', serif;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }

        .price-input-container {
            position: relative;
        }

        .price-currency-symbol {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-gold);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .price-input {
            padding-left: 35px !important;
        }

        .form-actions {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        /* Actions admin sur les cartes */
        .admin-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Cormorant Garamond', serif;
        }

        .action-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .action-btn.edit:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        .action-btn.delete:hover {
            background: rgba(231, 76, 60, 0.1);
            border-color: #e74c3c;
            color: #e74c3c;
        }

        /* Footer */
        .luxury-footer {
            text-align: center;
            padding: 80px 0;
            margin-top: 100px;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--text-gray);
        }

        .footer-quote {
            font-style: italic;
            margin-top: 20px;
            font-size: 1.3rem;
            color: var(--light-gold);
            font-weight: 300;
            margin-bottom: 30px;
            font-family: 'Cormorant Garamond', serif;
        }

        .linktree-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            padding: 12px 25px;
            border: 2px solid rgba(212, 175, 55, 0.4);
            font-family: 'Cormorant Garamond', serif;
        }

        .linktree-link:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--accent-gold);
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .brand-title {
                font-size: 2.8rem;
                letter-spacing: 4px;
            }
            
            .access-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .perfume-grid {
                grid-template-columns: 1fr;
                padding: 30px;
            }
            
            .luxury-btn {
                width: 100%;
                justify-content: center;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .admin-actions {
                flex-direction: column;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }

            .modal-content {
                grid-template-columns: 1fr;
                max-height: 90vh;
                overflow-y: auto;
            }

            .modal-image {
                height: 250px;
            }

            .modal-info {
                padding: 40px 30px;
            }
        }

        /* État vide */
        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: var(--text-gray);
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 25px;
            color: var(--accent-gold);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="luxury-bg"></div>
    
    <div class="container">
        <!-- En-tête principal -->
        <div class="luxury-header">
            <h1 class="brand-title">BAHJAT AL ATR</h1>
            <div class="gold-bar"></div>
            <p class="brand-subtitle">MAISON DE PARFUM D'EXCEPTION</p>
            
            <div class="access-buttons">
                <button class="luxury-btn" onclick="showClientAccess()">
                    DÉCOUVRIR LA COLLECTION
                </button>
                <button class="luxury-btn luxury-btn-secondary" onclick="showAdminAccess()">
                    ESPACE ADMIN
                </button>
            </div>
        </div>

        <!-- Panneau Client -->
        <div class="access-panel active" id="clientPanel">
            <h2 class="panel-title">Collection Signature</h2>
            <div class="perfume-grid" id="clientPerfumeGrid">
                <!-- Parfums chargés dynamiquement -->
            </div>
        </div>

        <!-- Panneau Admin -->
        <div class="access-panel" id="adminPanel">
            <h2 class="panel-title">Gestion de la Collection</h2>
            
            <div class="admin-form">
                <form id="perfumeForm">
                    <input type="hidden" id="perfumeId">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Nom du Parfum</label>
                            <input type="text" class="form-input" id="perfumeName" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Marque</label>
                            <input type="text" class="form-input" id="perfumeBrand" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Volume</label>
                            <input type="text" class="form-input" id="perfumeSize" placeholder="100ml" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Genre</label>
                            <select class="form-input" id="perfumeGender" required>
                                <option value="">Sélectionner</option>
                                <option value="Féminin">Féminin</option>
                                <option value="Masculin">Masculin</option>
                                <option value="Unisexe">Unisexe</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Prix</label>
                            <div class="price-input-container">
                                <span class="price-currency-symbol">€</span>
                                <input type="number" class="form-input price-input" id="perfumePrice" placeholder="0.00" min="0" step="0.01" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Notes Olfactives</label>
                            <input type="text" class="form-input" id="perfumeNotes" placeholder="Vanille, Ambre, Patchouli..." required>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="luxury-btn" id="savePerfume">
                            ENREGISTRER
                        </button>
                        <button type="button" class="luxury-btn luxury-btn-secondary" id="cancelEdit" onclick="resetForm()">
                            ANNULER
                        </button>
                    </div>
                </form>
            </div>

            <div class="perfume-grid" id="adminPerfumeGrid">
                <!-- Parfums avec options admin -->
            </div>
        </div>

        <!-- Modal détaillé -->
        <div class="perfume-modal" id="perfumeModal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
                <div class="modal-image" id="modalImage">
                    <i class="fas fa-gem"></i>
                </div>
                <div class="modal-info" id="modalInfo">
                    <!-- Contenu chargé dynamiquement -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="luxury-footer">
            <p class="footer-quote">"Quand l'élégance du parfum prend tout son sens"</p>
            <a href="https://linktr.ee/bahjatalatr?utm_source=linktree_profile_share&ltsid=d14ad074-6f51-4fd6-b9d8-c24a648e7166" 
               class="linktree-link" target="_blank">
                <i class="fas fa-link"></i>
                Retrouvez-nous sur Linktree
            </a>
            <p style="margin-top: 30px; color: var(--text-gray);">© 2025 BAHJAT AL ATR – TOUS DROITS RÉSERVÉS</p>
        </div>
    </div>

    <script>
        // [Le code JavaScript reste exactement le même que précédemment]
        // Données initiales avec prix
        const initialPerfumes = [
            {
                id: 1,
                name: "Khamrah Dukhan",
                brand: "Lattafa",
                size: "100ml",
                gender: "Unisexe",
                price: 89.90,
                notes: ["Piment", "Mandarine", "Incense", "Ciste", "Patchouli", "Fleurs d'oranger", "Tabac", "Praline", "Ambre", "Fèves de tonkas", "Bensoide"]
            },
            {
                id: 2,
                name: "Venezia Pistachio",
                brand: "Gulf Fragance Dubai",
                size: "80ml",
                gender: "Unisexe",
                price: 79.90,
                notes: ["Pistaches", "Amandes", "Crème fouettée", "Héliotrope", "Musc", "Bois de santal"]
            },
            {
                id: 3,
                name: "Yara Rose",
                brand: "Lattafa",
                size: "100ml / 35ml",
                gender: "Féminin",
                price: 69.90,
                notes: ["Mandarine", "Poire", "Orchidée", "Vanille", "Bois de santale", "Musc", "Héliotrope", "Bergamote"]
            },
            {
                id: 4,
                name: "Yara Blanc",
                brand: "Lattafa",
                size: "100ml",
                gender: "Féminin",
                price: 65.90,
                notes: ["Jasmin", "Pêche", "Ambre", "Caramel", "Bois de santal", "Patchouli"]
            },
            {
                id: 5,
                name: "Yara Black",
                brand: "Lattafa",
                size: "100ml",
                gender: "Masculin",
                price: 74.90,
                notes: ["Ananas", "Tabac", "Poivre noir", "Vanille", "Café", "Patchouli", "Ambre", "Benjoin", "Bois", "Labdanum"]
            },
            {
                id: 6,
                name: "Ameerat al Arab Rouge",
                brand: "Lattafa",
                size: "50ml",
                gender: "Féminin",
                price: 59.90,
                notes: ["Pamplemousse", "Orange", "Jasmin", "Muse Blanc", "Ambre", "Bois de santal", "Vanille", "Fèves de Tonka"]
            }
        ];

        // Variables globales
        let perfumes = [];
        let editingId = null;

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            loadPerfumes();
            setupEventListeners();
        });

        // Configuration des écouteurs d'événements
        function setupEventListeners() {
            document.getElementById('perfumeForm').addEventListener('submit', handleFormSubmit);
        }

        // Charger les parfums
        function loadPerfumes() {
            const storedPerfumes = localStorage.getItem('bahjatAlAtrPerfumes');
            if (storedPerfumes) {
                perfumes = JSON.parse(storedPerfumes);
            } else {
                perfumes = [...initialPerfumes];
                savePerfumes();
            }
            renderClientPerfumes();
            renderAdminPerfumes();
        }

        // Sauvegarder les parfums
        function savePerfumes() {
            localStorage.setItem('bahjatAlAtrPerfumes', JSON.stringify(perfumes));
        }

        // Afficher l'accès client
        function showClientAccess() {
            document.getElementById('clientPanel').classList.add('active');
            document.getElementById('adminPanel').classList.remove('active');

        // Formatage du prix
        function formatPrice(price) {
            return new Intl.NumberFormat('fr-FR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(price);
        }

        // Ouvrir le modal détaillé

            const perfume = perfumes.find(p => p.id === perfumeId);
            if (perfume) {
                document.getElementById('modalInfo').innerHTML = `
                    <h2 class="modal-name">${perfume.name}</h2>
                    <div class="modal-price">${formatPrice(perfume.price)} €</div>
